<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071C42"><title>TASVIA Staff Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#071C42,#0B2858);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
.card{width:min(420px,100%);background:#fff;color:#152033;border-radius:22px;padding:28px;box-shadow:0 20px 60px #0005}.logo{display:block;width:100px;height:100px;margin:0 auto 14px;border-radius:50%;box-shadow:0 0 0 3px #C99A3D}.brand{text-align:center;font-size:28px;font-weight:800}.brand span{color:#C99A3D}.tag{text-align:center;color:#667085;font-size:13px;margin:5px 0 24px}label{display:block;font-size:13px;font-weight:700;margin:13px 0}input{display:block;width:100%;margin-top:6px;padding:13px;border:1px solid #D0D5DD;border-radius:11px;font-size:16px}button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:11px;background:#C99A3D;color:#17130B;font-weight:800;font-size:16px}button:disabled{opacity:.6}.status{min-height:22px;margin-top:14px;text-align:center;font-size:13px;color:#667085}.error{color:#B42318}.ok{color:#16845B}.small{display:block;text-align:center;margin-top:12px;color:#667085;background:none;font-size:13px;padding:5px}
</style></head><body>
<main class="card">
<img class="logo" src="logo.png" alt="TASVIA Academy">
<div class="brand">TASVIA <span>Academy</span></div><div class="tag">Staff Portal · Inspire • Learn • Grow • Succeed</div>
<form id="login" novalidate>
<label>Email<input id="email" type="email" autocomplete="username" required></label>
<label>Password<input id="password" type="password" autocomplete="current-password" required></label>
<button id="btn" type="submit">Sign in</button>
<button id="forgot" class="small" type="button">Forgot password?</button>
<div id="status" class="status"></div>
</form></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
 const $=id=>document.getElementById(id),status=$("status"),btn=$("btn"),form=$("login");
 let auth=null, busy=false;
 function msg(t,kind){status.textContent=t;status.className="status "+(kind||"")}
 function timeout(p,ms){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("Request timed out. Check your internet connection.")),ms))])}
 async function boot(){
   try{
     if(!window.firebase||!window.FIREBASE_CONFIG?.apiKey)throw new Error("Firebase is unavailable. Reload the page.");
     const app=firebase.apps?.length?firebase.app():firebase.initializeApp(window.FIREBASE_CONFIG);
     auth=firebase.auth();
     const u=auth.currentUser;
     if(u) msg("Existing session found. Opening Staff Portal…","ok");
   }catch(e){msg(e.message||"Unable to start Staff login.","error")}
 }
 form.addEventListener("submit",async e=>{
   e.preventDefault(); if(busy)return;
   const email=$("email").value.trim().toLowerCase(),password=$("password").value;
   if(!email||!password){msg("Enter your email and password.","error");return}
   busy=true;btn.disabled=true;btn.textContent="Signing in…";msg("Connecting to Firebase…");
   try{
     if(!auth)await boot();
     if(!auth)throw new Error("Firebase Authentication is unavailable.");
     try{await timeout(auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL),8000)}catch(_){/* fallback to default */}
     let cred;
     try{
       cred=await timeout(auth.signInWithEmailAndPassword(email,password),15000);
     }catch(authErr){
       const ac=String(authErr&&authErr.code||"");
       if(ac==="auth/unauthorized-domain") throw new Error("This Staff Portal domain is not authorized in Firebase. Add apk.tasviaacademy.com under Authentication → Settings → Authorized domains.");
       if(ac==="auth/operation-not-allowed") throw new Error("Email/Password sign-in is disabled in Firebase Authentication.");
       if(ac==="auth/network-request-failed") throw new Error("Firebase sign-in could not reach the server. Check the internet connection and try again.");
       throw authErr;
     }
     const u=cred.user||auth.currentUser;
     if(!u)throw new Error("Firebase sign-in completed without a user session.");
     msg("Signed in. Verifying Staff account…");
     if(email!=="tasviaacademy@gmail.com"){
       const db=firebase.firestore();
       // Query by email first so legacy Staff records with auto-generated
       // document IDs remain compatible with the existing Firestore rules.
       let snap=null;
       try{
         const direct=await timeout(db.collection("Staff").doc(email).get(),10000);
         if(direct.exists)snap=direct;
       }catch(err){
         console.warn("Canonical Staff lookup failed; trying legacy email lookup",err);
       }
       if(!snap){
         try{
           const q=await timeout(db.collection("Staff").where("email","==",email).limit(1).get(),10000);
           if(!q.empty)snap=q.docs[0];
         }catch(err){
           console.warn("Legacy Staff email lookup failed",err);
         }
       }
       if(!snap)throw new Error("This email is not registered in TASVIA Staff.");
     }
     sessionStorage.setItem("tasviaStaffEntry","1");
     msg("Staff verified. Opening portal…","ok");
     location.replace("./index.html?staff=1&staffEntry=1&v=20261008");
   }catch(e){
     const c=e&&e.code||"";
     msg(c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found"?"Email or password is incorrect.":e.message||"Sign-in failed.","error");
   }finally{busy=false;btn.disabled=false;btn.textContent="Sign in"}
 });
 $("forgot").addEventListener("click",async()=>{
   const email=$("email").value.trim().toLowerCase();
   if(!email){msg("Enter your email first.","error");return}
   try{if(!auth)await boot();await timeout(auth.sendPasswordResetEmail(email),10000);msg("Password reset link sent.","ok")}
   catch(e){msg(e.message||"Unable to send reset link.","error")}
 });
 boot();
})();
</script></body></html>
