<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TASVIA Academy – Parent</title>
<meta name="theme-color" content="#0B2455">
<meta name="robots" content="noindex">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TASVIA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Hind:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1EE;--card:#fff;--ink:#15201C;--muted:#5B6A63;--line:#D3DCD7;--chip:#E2E9E5;--board:#0B2455;--chalk:#F3F6F1;--gold:#F2AC10;--p:#2B8A55;--a:#C4432A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0E1613;--card:#17221E;--ink:#E6EDE9;--muted:#98A9A1;--line:#29372F;--chip:#213029;--board:#081A3E}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Hind,"Noto Sans Telugu","Noto Sans Devanagari",system-ui,sans-serif}
h1,h2,h3{font-family:"Baloo 2",Hind,"Noto Sans Telugu","Noto Sans Devanagari",system-ui,sans-serif;margin:0;line-height:1.2}
header{background:var(--board);color:var(--chalk);padding:16px 18px 22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.hlogo{width:36px;height:36px;border-radius:50%;background:#fff;vertical-align:middle;margin:-4px 8px 0 0;box-shadow:0 0 0 2px var(--gold)}
#banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-150%);z-index:50;display:flex;gap:10px;align-items:center;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:min(92%,420px);transition:transform .35s}#banner.show{transform:translate(-50%,0)}#banner img{width:36px;height:36px;border-radius:50%}#banner b{display:block}#banner span{color:var(--muted);font-size:.9rem}
.brand{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.3rem;white-space:nowrap}.brand span{color:var(--gold)}
.langs{display:flex;gap:4px}
.langs button{border:0;border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.12);color:var(--chalk);font:inherit;font-size:.85rem;cursor:pointer}
.langs button.on{background:var(--gold);color:#1a1405;font-weight:600}
.kid{max-width:640px;margin:14px auto 0}
.kid{display:flex;gap:14px;align-items:center}.kid .ph{width:72px;height:96px;border-radius:12px;overflow:hidden;border:3px solid var(--gold);flex:0 0 auto}.kid .ph img{width:100%;height:100%;object-fit:cover;display:block}
.kid h1{font-size:1.9rem}.kid p{margin:2px 0 0;opacity:.85}
main{max-width:640px;margin:-10px auto 0;padding:0 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.card h2{font-size:1.2rem;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:"Baloo 2",sans-serif;font-size:1.9rem;line-height:1.1}
.stats small{color:var(--muted)}
.ok{color:var(--p)}.bad{color:var(--a)}.gold{color:#B8820A}
.bar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--p)}
.sub{color:var(--muted);font-size:.9rem}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.85rem}
td.r,th.r{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:.8rem;font-weight:600;border-radius:999px;padding:2px 10px}
.tag.ok{background:color-mix(in srgb,var(--p) 16%,transparent)}.tag.bad{background:color-mix(in srgb,var(--a) 14%,transparent)}.tag.gold{background:color-mix(in srgb,var(--gold) 18%,transparent)}
.hw{border-left:4px solid var(--gold);padding:4px 0 4px 12px;margin:10px 0}
.hw b{font-size:.9rem;color:var(--muted);font-weight:600}
.hw div{white-space:pre-wrap}
.hw-completed{border-left-color:var(--p);background:color-mix(in srgb,var(--p) 5%,var(--card));border-radius:0 10px 10px 0;padding-right:10px}
.hw-completed>div:first-of-type{text-decoration:line-through;opacity:.72}
.hw-complete-btn{margin-top:9px;border:0;cursor:pointer;font:600 14px Hind,sans-serif;padding:8px 12px;min-height:38px}
.hw-complete-btn:not(.gold){background:var(--p);color:#fff}
.hw-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hw-count{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:700;white-space:nowrap}
.hw-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hw-status{font-size:.76rem;border-radius:999px;padding:3px 8px;font-weight:700;white-space:nowrap}.hw-status.done{background:color-mix(in srgb,var(--p) 15%,transparent);color:var(--p)}.hw-status.pending{background:color-mix(in srgb,var(--gold) 18%,transparent);color:#9A6A00}
.hw-overdue{border-left-color:var(--a)}.hw-overdue .hw-status{background:color-mix(in srgb,var(--a) 13%,transparent);color:var(--a)}
.hw-filter{display:flex;gap:6px;margin:10px 0 4px}.hw-filter-btn{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 5px;background:var(--chip);color:var(--ink);font:600 13px Hind,sans-serif;cursor:pointer}.hw-filter-btn.active{background:var(--board);color:#fff;border-color:var(--board)}
.notice{border-left:5px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--card));padding:10px 14px;border-radius:0 12px 12px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-block;text-decoration:none;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--board);color:var(--chalk)}
.btn.gold{background:var(--gold);color:#1a1405}.upi-apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:10px}.upi-app{display:block;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:9px 5px;background:var(--card);color:var(--ink);font-weight:600;font-size:.86rem}.upi-app:active{transform:scale(.98)}
.center{text-align:center;padding:60px 20px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.88rem}

/* PARENT FEE DUE — premium attention cue */
@keyframes feeGlow{0%,100%{box-shadow:0 4px 18px rgba(199,71,64,.08)}50%{box-shadow:0 8px 28px rgba(199,71,64,.22)}}
@keyframes feeSweep{0%{transform:translateX(-120%);opacity:0}12%{opacity:.55}55%{opacity:.15}100%{transform:translateX(260%);opacity:0}}
.fee-due{position:relative;overflow:hidden;border:1.5px solid rgba(199,71,64,.48);animation:feeGlow 2.4s ease-in-out infinite}
.fee-due::after{content:"";position:absolute;top:0;bottom:0;left:0;width:38%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.34),transparent);transform:translateX(-120%);animation:feeSweep 3.6s ease-in-out infinite;pointer-events:none}
.fee-due .fee-alert{display:flex;align-items:center;gap:8px;margin:-3px 0 11px;padding:8px 10px;border-radius:10px;background:rgba(199,71,64,.09);color:var(--a);font-weight:700;font-size:.88rem}
.fee-due .fee-alert .dot{width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 0 5px rgba(199,71,64,.12);animation:feeDot 1.4s ease-in-out infinite}
@keyframes feeDot{50%{transform:scale(1.35);opacity:.65}}
@media(prefers-reduced-motion:reduce){
 .fee-due,.fee-due::after,.fee-due .fee-alert .dot{animation:none!important}
}

/* PARENT FEE DUE POPUP */
.fee-popup-backdrop{position:fixed;inset:0;z-index:100;background:rgba(7,18,14,.58);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .28s ease,visibility .28s ease}
.fee-popup-backdrop.show{opacity:1;visibility:visible}
.fee-popup{width:min(94%,390px);background:var(--card);border:1px solid rgba(199,71,64,.28);border-top:5px solid var(--a);border-radius:20px;padding:24px 20px 18px;box-shadow:0 22px 60px rgba(0,0,0,.32);transform:translateY(18px) scale(.96);transition:transform .32s cubic-bezier(.22,1,.36,1);text-align:center}
.fee-popup-backdrop.show .fee-popup{transform:translateY(0) scale(1)}
.fee-popup-icon{width:54px;height:54px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:rgba(196,67,42,.1);font-size:27px;animation:feePopupPulse 1.5s ease-in-out infinite}
.fee-popup h3{font-size:1.45rem;color:var(--ink);margin-bottom:5px}
.fee-popup .due-label{color:var(--a);font-weight:700;font-size:.95rem}
.fee-popup .due-amount{font-family:"Baloo 2",sans-serif;font-size:2rem;font-weight:800;color:var(--a);line-height:1.15;margin:7px 0 15px}
.fee-popup .due-note{color:var(--muted);font-size:.9rem;margin:0 0 16px}
.fee-popup .fee-popup-skip{display:block;margin:10px auto 0;border:0;background:transparent;color:var(--muted);font:500 14px Hind,sans-serif;cursor:pointer;padding:6px 14px}
.fee-popup .acts{justify-content:center;margin-top:0}
.fee-popup .btn{min-width:125px;cursor:pointer;border:0;font:inherit}
@keyframes feePopupPulse{50%{transform:scale(1.08);box-shadow:0 0 0 9px rgba(196,67,42,.06)}}
@media(prefers-reduced-motion:reduce){.fee-popup-backdrop,.fee-popup{transition:none}.fee-popup-icon{animation:none}}

.photo-upload{display:flex;align-items:center;gap:12px;padding:12px;border:1px dashed var(--line);border-radius:14px;background:var(--chip);margin-top:10px}.photo-upload .preview{width:58px;height:72px;border-radius:10px;overflow:hidden;border:2px solid var(--gold);background:var(--chip);display:grid;place-items:center;font-size:24px;flex:0 0 auto}.photo-upload .preview img{width:100%;height:100%;object-fit:cover}.photo-upload input{display:none}

/* PARENT WELCOME EXPERIENCE */
.welcome-backdrop{position:fixed;inset:0;z-index:999;background:linear-gradient(145deg,#071a3d 0%,#0B2455 58%,#102e68 100%);display:flex;align-items:center;justify-content:center;padding:24px;opacity:1;visibility:visible;transition:opacity .45s ease,visibility .45s ease}
.welcome-backdrop.hide{opacity:0;visibility:hidden;pointer-events:none}
.welcome-card{width:min(92%,390px);text-align:center;color:#F3F6F1}
.welcome-logo-wrap{width:112px;height:112px;margin:0 auto 18px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px #F2AC10,0 14px 45px rgba(0,0,0,.28);animation:welcomeLogoIn .75s cubic-bezier(.22,1,.36,1) both}
.welcome-logo{width:88px;height:88px;border-radius:50%;object-fit:contain}
.welcome-card h2{font-family:"Baloo 2",sans-serif;font-size:2rem;line-height:1.05;margin:0 0 7px}
.welcome-card h2 span{color:#F2AC10}
.welcome-card p{margin:0 auto;color:rgba(243,246,241,.86);font-size:1rem;max-width:320px}
.welcome-tag{margin-top:12px!important;font-size:.82rem!important;color:#F2AC10!important;font-weight:600;letter-spacing:.04em}
.welcome-enter{margin-top:24px;border:1px solid rgba(242,172,16,.7);border-radius:999px;background:#F2AC10;color:#1a1405;padding:11px 24px;font:600 16px Hind,sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.welcome-sound{margin-top:12px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(255,255,255,.08);color:#F3F6F1;padding:7px 14px;font:500 13px Hind,sans-serif;cursor:pointer}
.welcome-sound.off{opacity:.72}
.student-login-form{width:min(100%,340px);margin:22px auto 0;text-align:left}
.student-login-label{display:block;color:rgba(243,246,241,.9);font-size:.85rem;font-weight:600;margin:0 0 5px 4px}
.student-login-input{display:block;width:100%;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:#fff;color:#15201C;padding:12px 13px;font:600 16px Hind,sans-serif;text-transform:uppercase;outline:none}
.student-login-input:focus{border-color:#F2AC10;box-shadow:0 0 0 3px rgba(242,172,16,.2)}
.student-login-msg{min-height:1.35em;margin-top:8px;text-align:center;color:#F3A08E;font-size:.86rem}

@keyframes welcomeLogoIn{from{opacity:0;transform:scale(.65) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@media(prefers-reduced-motion:reduce){.welcome-logo-wrap{animation:none}.welcome-backdrop{transition:none}}


.brain-card{border:1px solid rgba(242,172,16,.35);background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--gold) 6%,var(--card)));overflow:hidden}.brain-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.brain-icon{width:46px;height:46px;border-radius:14px;background:var(--board);display:grid;place-items:center;font-size:25px;flex:0 0 auto}.brain-sub{margin:3px 0 0}.brain-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.brain-chips span{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.8rem}.brain-start{width:100%;margin-top:12px;border:0;cursor:pointer;font:600 16px Hind,sans-serif}.brain-game{margin-top:12px;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--chip)}.brain-bar{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.82rem;color:var(--muted);margin-bottom:10px}.brain-bar b{color:var(--ink)}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:0 auto}.memory-card{aspect-ratio:1;border:0;border-radius:12px;background:var(--board);color:#fff;cursor:pointer;min-width:44px;min-height:44px;font:700 1.45rem/1 Hind,sans-serif;box-shadow:0 3px 7px rgba(0,0,0,.18)}.memory-card.revealed,.memory-card.matched{background:var(--card);color:var(--ink);border:2px solid var(--gold)}.memory-card.matched{opacity:.72}.memory-card:disabled{cursor:default}.memory-card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.memory-symbol{display:none}.memory-card.revealed .memory-symbol,.memory-card.matched .memory-symbol{display:block}.memory-card.revealed .memory-back,.memory-card.matched .memory-back{display:none}.brain-feedback{text-align:center;font-weight:700;min-height:25px;margin-top:9px}.brain-feedback.ok{color:var(--p)}.brain-feedback.bad{color:var(--a)}.brain-games{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.brain-game-btn{border:1px solid var(--line);border-radius:12px;padding:11px 8px;background:var(--card);color:var(--ink);font:600 15px Hind,sans-serif;cursor:pointer}.brain-game-btn:active{transform:scale(.98)}.brain-question{font-size:1.35rem;font-weight:800;text-align:center;margin:8px 0 12px}.brain-options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.brain-option{border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--card);color:var(--ink);font:700 16px Hind,sans-serif;cursor:pointer}.brain-option.correct{border-color:var(--p);background:color-mix(in srgb,var(--p) 14%,var(--card))}.brain-option.wrong{border-color:var(--a);background:color-mix(in srgb,var(--a) 12%,var(--card))}.sequence-box{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0}.sequence-box span{min-width:42px;padding:8px 10px;border-radius:10px;background:var(--board);color:#fff;font-weight:800;text-align:center}.sequence-box .missing{background:var(--gold);color:#1a1405}

/* BODMAS PRACTICE */
.bodmas-card{border:1px solid rgba(43,138,85,.28);background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--p) 5%,var(--card)));overflow:hidden}
.bodmas-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bodmas-icon{width:46px;height:46px;border-radius:14px;background:var(--board);color:#fff;display:grid;place-items:center;font-size:24px;flex:0 0 auto}
.bodmas-sub{margin:3px 0 0}
.bodmas-levels{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}
.bodmas-level{border:1px solid var(--line);border-radius:10px;padding:8px 5px;background:var(--card);color:var(--ink);font:600 14px Hind,sans-serif;cursor:pointer}
.bodmas-level.active{background:var(--board);color:#fff;border-color:var(--board)}
.bodmas-panel{margin-top:11px;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--chip)}
.bodmas-meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.84rem}
.bodmas-question{text-align:center;font-family:"Baloo 2",sans-serif;font-size:1.65rem;font-weight:800;letter-spacing:.02em;margin:12px 0}
.bodmas-input-row{display:flex;gap:8px;max-width:360px;margin:0 auto}
.bodmas-input{flex:1;min-width:0;border:2px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--card);color:var(--ink);font:700 18px Hind,sans-serif;text-align:center}
.bodmas-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,172,16,.15)}
.bodmas-submit{border:0;border-radius:11px;padding:10px 16px;background:var(--board);color:#fff;font:700 15px Hind,sans-serif;cursor:pointer}
.bodmas-submit:disabled{opacity:.55;cursor:default}
.bodmas-feedback{text-align:center;min-height:26px;margin-top:9px;font-weight:700}
.bodmas-feedback.ok{color:var(--p)}.bodmas-feedback.bad{color:var(--a)}
.bodmas-next{width:100%;margin-top:9px;border:0;cursor:pointer;font:600 15px Hind,sans-serif}
.bodmas-progress{height:8px;border-radius:5px;background:var(--card);overflow:hidden;margin:8px 0 2px}
.bodmas-progress i{display:block;height:100%;background:var(--p);transition:width .25s ease}
.bodmas-result{text-align:center;padding:9px 0 2px}
.bodmas-result strong{font-family:"Baloo 2",sans-serif;font-size:1.8rem}
@media(max-width:380px){.bodmas-input-row{flex-direction:column}.bodmas-submit{width:100%}}

.gk-card{border:1px solid rgba(242,172,16,.3);background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--gold) 5%,var(--card)));overflow:hidden}.gk-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.gk-icon{width:46px;height:46px;border-radius:14px;background:var(--board);color:#fff;display:grid;place-items:center;font-size:24px}.gk-list{display:grid;gap:9px;margin-top:10px}.gk-q{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--chip)}.gk-q b{display:block}.gk-answer{display:block;color:var(--p);font-weight:700;font-size:.9rem;margin-top:3px}\n
/* TASVIA ACTION VISIBILITY / MOBILE SAFE LAYER */
button,.btn,a.btn{visibility:visible;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:40px;min-height:40px;white-space:normal;text-align:center;line-height:1.25;}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;overflow:visible;}
.acts > .btn,.acts > a.btn,.acts > button{flex:0 0 auto;max-width:100%;}
.item{overflow:visible;}
@media(max-width:520px){.acts > .btn,.acts > a.btn,.acts > button{min-height:42px}.acts > .btn.sm,.acts > a.btn.sm,.acts > button.btn.sm{min-height:38px}}

/* DAILY CURRENT AFFAIRS */

/* Parent portal 2x2 quick-action grid */
.parent-dashboard{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--board) 4%,var(--card)));box-shadow:0 4px 18px rgba(11,36,85,.06)}
.parent-dashboard-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.parent-dashboard-title{font-weight:800;font-size:1.05rem}
.parent-dashboard-sub{color:var(--muted);font-size:.8rem}
.parent-dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.parent-dashboard-item{min-width:0;padding:10px 7px;border:1px solid var(--line);border-radius:12px;background:var(--chip);text-align:center}
.parent-dashboard-item b{display:block;font-family:"Baloo 2",sans-serif;font-size:1.35rem;line-height:1.15}
.parent-dashboard-item small{display:block;color:var(--muted);font-size:.76rem;margin-top:2px}
.parent-dashboard-item.ok b{color:var(--p)}.parent-dashboard-item.bad b{color:var(--a)}.parent-dashboard-item.gold b{color:#B8820A}
.parent-empty{padding:12px;border:1px dashed var(--line);border-radius:12px;background:var(--chip);color:var(--muted);text-align:center}

function homeworkCompletionKey(x){
  const raw=[x?.id,x?.d,x?.subject,x?.hw,x?.note].map(v=>String(v??"").trim()).join("|");
  let h=2166136261;
  for(let i=0;i<raw.length;i++){h^=raw.charCodeAt(i);h=Math.imul(h,16777619)}
  return "hw_"+(h>>>0).toString(36);
}
let parentHomeworkCloudMap={};
let parentHomeworkCloudReady=false;
function homeworkDoneMap(){
  const code=String(parentStudentCode||"portal").trim().toUpperCase()||"portal";
  const cloud=parentHomeworkCloudMap&&typeof parentHomeworkCloudMap==="object"?parentHomeworkCloudMap:{};
  if(Object.keys(cloud).length)return cloud;
  try{const raw=JSON.parse(localStorage.getItem("tasvia-homework-completed")||"{}");return raw&&typeof raw==="object"&&!Array.isArray(raw)?(raw[code]||{}):{}}catch(_){return {}}
}
function homeworkCompletionDocRef(){
  try{
    if(window.firebase&&firebase.firestore&&window.FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey){
      if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
      const code=String(parentStudentCode||"portal").trim().toUpperCase()||"portal";
      return firebase.firestore().doc("homeworkCompletions/"+code);
    }
  }catch(e){console.warn("TASVIA homework cloud init",e)}
  return null;
}
async function loadHomeworkCompletions(){
  const ref=homeworkCompletionDocRef(); if(!ref)return;
  try{
    const snap=await ref.get();
    if(snap.exists){
      const d=snap.data()||{};
      parentHomeworkCloudMap=d.completed&&typeof d.completed==="object"?d.completed:{};
      parentHomeworkCloudReady=true;
      try{
        const code=String(parentStudentCode||"portal").trim().toUpperCase()||"portal";
        const raw=JSON.parse(localStorage.getItem("tasvia-homework-completed")||"{}");
        const db=raw&&typeof raw==="object"&&!Array.isArray(raw)?raw:{};
        db[code]=parentHomeworkCloudMap; localStorage.setItem("tasvia-homework-completed",JSON.stringify(db));
      }catch(_){}
      try{filterParentHomework(parentHomeworkFilterMode,document.querySelector("#homeworkSection .hw-filter-btn.active"))}catch(_){}
    }
  }catch(e){console.warn("TASVIA homework cloud load failed",e)}
}
async function persistHomeworkCompletions(){
  const ref=homeworkCompletionDocRef(); if(!ref)return false;
  const code=String(parentStudentCode||"portal").trim().toUpperCase()||"portal";
  try{
    await ref.set({code,completed:parentHomeworkCloudMap,updatedAt:new Date().toISOString()},{merge:true});
    parentHomeworkCloudReady=true;
    return true;
  }catch(e){console.warn("TASVIA homework cloud save failed",e);return false}
}

function parentFeePeriodPaymentInfo(feeRow,payments){
  const rawMonth=String(feeRow?.m||"").trim();
  const ym=/^(\d{4})-(\d{1,2})/.exec(rawMonth);
  if(!ym)return {amount:0,hasDatedAssociation:false};
  const year=Number(ym[1]),month=Number(ym[2]);
  if(!year||month<1||month>12)return {amount:0,hasDatedAssociation:false};
  const start=new Date(year,month-1,1);
  const next=new Date(year,month,1);
  const feeKey=rawMonth.slice(0,7);
  let total=0,hasDatedAssociation=false;
  (Array.isArray(payments)?payments:[]).forEach(p=>{
    if(!p||typeof p!=="object")return;
    const amount=Math.max(0,Number(p.a??p.amount??0)||0); if(!amount)return;
    const rawDate=String(p.d||p.date||"").trim();
    const paymentKey=String(p.m||"").slice(0,7);
    const pd=/^\d{4}-\d{2}-\d{2}$/.test(rawDate)?new Date(rawDate+"T00:00:00"):null;
    const explicit=paymentKey===feeKey;
    const dated=!!pd&&pd>=start&&pd<=next;
    if(explicit||dated){
      total+=amount;
      if(pd)hasDatedAssociation=true;
    }
  });
  return {amount:total,hasDatedAssociation};
}
function parentActiveHomework(){
  const all=Array.isArray(V?.hw)?V.hw.filter(x=>x&&typeof x==="object"):[];
  const now=Date.now();
  return all.filter(x=>{
    const tm=Date.parse(String(x.d||""));
    return Number.isFinite(tm)&&now-tm>=0&&now-tm<30*24*60*60*1000;
  }).sort((a,b)=>String(b.d).localeCompare(String(a.d)));
}
async function toggleHomeworkCompletedByKey(key){
  const active=parentActiveHomework();
  const k=String(key||"");
  const x=active.find(item=>homeworkCompletionKey(item)===k);
  if(!x)return false;
  const code=String(parentStudentCode||"portal").trim().toUpperCase()||"portal";
  parentHomeworkCloudMap=parentHomeworkCloudMap&&typeof parentHomeworkCloudMap==="object"?parentHomeworkCloudMap:{};
  if(parentHomeworkCloudMap[k])delete parentHomeworkCloudMap[k];
  else parentHomeworkCloudMap[k]={completedAt:new Date().toISOString()};
  try{
    const raw=JSON.parse(localStorage.getItem("tasvia-homework-completed")||"{}");
    const db=raw&&typeof raw==="object"&&!Array.isArray(raw)?raw:{};
    db[code]=parentHomeworkCloudMap;
    localStorage.setItem("tasvia-homework-completed",JSON.stringify(db));
  }catch(_){}
  const activeBtn=document.querySelector("#homeworkSection .hw-filter-btn.active");
  filterParentHomework(parentHomeworkFilterMode,activeBtn);
  const saved=await persistHomeworkCompletions();
  if(!saved)console.warn("TASVIA: homework kept locally because cloud save failed");
  return true;
}

function renderParentHomeworkItems(items){

    return '<div class="parent-empty">📚 '+esc(T[L].noHw||"No homework")+'</div>';
  }
  return list.map(x=>{
    const done=isHomeworkCompleted(x),key=homeworkCompletionKey(x);
    const keyArg=String(key).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
    return '<div class="hw hw-row '+(done?'hw-completed':'')+'" data-hw-status="'+(done?'completed':'pending')+'">'+
      '<div><b>'+esc(dN(x.d))+'</b><div>'+esc(x.hw||x.text||'')+'</div>'+(x.note?'<div class="sub">'+esc(x.note)+'</div>':'')+'</div>'+
      '<button type="button" class="hw-complete-btn '+(done?'gold':'')+'" data-hw-key="'+esc(key)+'">'+
      (done?esc(T[L].markPending):esc(T[L].markCompleted))+'</button></div>';
  }).join('');
}
function filterParentHomework(mode,btn){
  const list=document.getElementById("parentHomeworkList"); if(!list)return;
  parentHomeworkFilterMode=mode==="pending"||mode==="completed"?mode:"all";
  const active=parentActiveHomework();
  const completedCount=active.filter(isHomeworkCompleted).length;
  const pendingCount=active.length-completedCount;
  const filtered=mode==="all"?active:mode==="completed"?active.filter(isHomeworkCompleted):active.filter(x=>!isHomeworkCompleted(x));
  list.innerHTML=renderParentHomeworkItems(filtered);
  document.querySelectorAll(".hw-filter-btn").forEach(b=>b.classList.toggle("active",b===btn));
  const count=document.querySelector("#homeworkSection .hw-count");
  if(count){
    count.textContent=(mode==="completed"?completedCount:pendingCount)+" "+(mode==="completed"?T[L].completed:T[L].pending);
  }
}

  const c=v.centre||{},ph=String(c.phone||"").replace(/\D/g,""),ph91=ph.length===10?"91"+ph:ph;

      // Never leave a valid Student ID stuck on "Checking Student ID".

        const ap=Number(a.p)||0,aa=Number(a.a)||0,at=ap+aa,apc=at?Math.round(ap*100/at):null;

        const currentFeePaid=currentFee?Math.min(
          currentFeeAmount,
          currentFeePaymentInfo.hasDatedAssociation
            ? currentFeePaymentInfo.amount

        ):0;
        const currentFeeDue=Math.max(0,currentFeeAmount-currentFeePaid);
        const currentFeeDate=currentFee&&currentFee.dueDate?String(currentFee.dueDate):"";
        const currentFeeIsDue=!!currentFee&&currentFeeDue>0&&(!currentFeeDate||today()>=currentFeeDate);
        const currentFeeStatus=currentFeeIsDue?"Due":currentFee&&currentFeeDue<=0?"Paid":currentFee?"Not Paid":"Not Paid";
        const feeTotal=fees.reduce((n,f)=>n+(Number(f.fee)||0),0);

        const testAvg=tests.length?Math.round(tests.reduce((n,x)=>n+(Number(x.x)?(Number(x.m)||0)*100/Number(x.x):0),0)/tests.length):null;
        const phone=String(cc.phone||"").replace(/\D/g,"");
        const escList=x=>esc(String(x||""));
        document.title=name+" – TASVIA Academy";
        document.getElementById("kid").innerHTML=(safe.photo&&/^data:image\/jpeg;base64,/.test(String(safe.photo))?'<div class="ph"><img src="'+safe.photo+'" alt=""></div>':"")+'<div><h1>'+esc(name)+'</h1><p>'+esc(cls)+(year?' · '+esc(year):'')+'</p></div>';
        let safeHtml=
          '<section class="parent-dashboard card"><div class="parent-dashboard-title">📊 Parent Dashboard</div><div class="parent-dashboard-grid">'+
          '<div class="parent-dashboard-item"><b>'+(ypc!=null?ypc+"%":"–")+'</b><small>Attendance</small></div>'+
          '<div class="parent-dashboard-item"><b>'+(testAvg!=null?testAvg+"%":"–")+'</b><small>Test Average</small></div>'+
          '<div class="parent-dashboard-item '+(currentFeeIsDue?"bad":currentFeeStatus==="Paid"?"ok":"")+'"><b>'+(currentFeeStatus==="Due"?rs(currentFeeDue):currentFeeStatus)+'</b><small>Current Month · '+currentFeeStatus+(currentFeeDate?' · '+new Date(currentFeeDate+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"")+'</small></div></div></section>'+
          '<div class="parent-action-grid" aria-label="Parent portal quick access">'+
          '<button type="button" class="parent-action" onclick="openParentSection(\'homeworkSection\')"><span class="parent-action-icon">📚</span><span>Homework</span></button>'+
          '<button type="button" class="parent-action" onclick="openParentSection(\'attendanceSection\')"><span class="parent-action-icon">📅</span><span>Attendance</span></button>'+
          '<button type="button" class="parent-action" onclick="openParentSection(\'feesSection\')"><span class="parent-action-icon">💳</span><span>Fee Details</span></button>'+
          '<button type="button" class="parent-action" onclick="openParentSection(\'gkSection\')"><span class="parent-action-icon">🧠</span><span>General Knowledge</span></button>'+
          '<button type="button" class="parent-action" onclick="openParentSection(\'currentAffairsCard\')"><span class="parent-action-icon">📰</span><span>Current Affairs</span></button>'+
          '<button type="button" class="parent-action" onclick="openParentSection(\'testsSection\')"><span class="parent-action-icon">📝</span><span>Tests</span></button>'+
          '<button type="button" class="parent-action" onclick="openParentSection(\'bodmasSection\')"><span class="parent-action-icon">🧮</span><span>BODMAS Practice</span></button>'+
          '<button type="button" class="parent-action" onclick="openParentSection(\'contactSection\')"><span class="parent-action-icon">📞</span><span>Contact</span></button>'+
          '</div>'+
          '<div class="card gk-card" id="gkSection">'+(typeof buildDailyGK==="function"?buildDailyGK():"<h2>🌍 General Knowledge</h2><p class='sub'>Loading daily GK…</p>")+'</div>'+
          '<div class="card ca-card" id="currentAffairsCard">'+(typeof buildCurrentAffairsCard==="function"?buildCurrentAffairsCard():"<h2>📰 Daily Current Affairs</h2><p class='sub'>Loading current affairs…</p>")+'</div>'+
          '<div class="card" id="homeworkSection"><h2>📚 Homework</h2>'+
          (hw.length?hw.slice(0,7).map(x=>'<div class="hw-item"><b>'+escList(x.d)+'</b><div>'+escList(x.hw)+'</div>'+(x.note?'<div class="sub">'+escList(x.note)+'</div>':"")+'</div>').join(""):'<div class="parent-empty">No homework added yet</div>')+
          '</div>'+
          buildBodmasCard()+
          '<div class="card" id="attendanceSection"><h2>📅 Attendance'+(cm?' · '+esc(cm):"")+'</h2><div class="stats"><div><b class="ok">'+ap+'</b><small>Present</small></div><div><b class="bad">'+aa+'</b><small>Absent</small></div><div><b>'+(apc!=null?apc+"%":"–")+'</b><small>Attendance</small></div></div>'+
          (safe.abs&&Array.isArray(safe.abs)&&safe.abs.length?'<p class="sub"><b>Recent absences:</b> '+safe.abs.slice(0,8).map(escList).join(", ")+'</p>':"")+
          '</div>'+
          '<div class="card" id="testsSection"><h2>📝 Test marks</h2>'+
          (tests.length?'<table><tr><th>Test</th><th class="r">Marks</th></tr>'+tests.map(x=>'<tr><td>'+escList(x.s)+' – '+escList(x.n)+'</td><td class="r">'+(Number(x.m)||0)+'/'+(Number(x.x)||0)+'</td></tr>').join("")+'</table>':'<div class="parent-empty">No test marks yet</div>')+
          '</div>'+
          '<div class="card" id="feesSection"><h2>💳 Fees</h2>'+
          (fees.length?'<table><tr><th>Month</th><th>Due Date</th><th class="r">Status</th></tr>'+fees.map(f=>{const due=Math.max(0,(Number(f.fee)||0)-(Number(f.paid)||0));const dd=f.dueDate?String(f.dueDate):"";let dateText="—";if(dd){const d=new Date(dd+"T00:00:00");dateText=Number.isNaN(d.getTime())?"—":d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});}return '<tr><td>'+escList(f.m)+'</td><td>'+dateText+'</td><td class="r">'+(due>0?'<span class="fee-due-badge">Due: '+rs(due)+'</span>':'<span class="tag ok">Paid</span>')+'</td></tr>'}).join("")+'</table>':'<div class="parent-empty">No fee records</div>')+
          (pays.length?'<p class="sub"><b>Recent payments</b></p><table>'+pays.slice().reverse().slice(0,10).map(p=>'<tr><td>'+escList(p.d)+'<br><span class="sub">'+escList(p.m)+' · '+escList(p.mode)+'</span></td><td class="r">'+rs(p.a)+'</td></tr>').join("")+'</table>':"")+
          '</div>'+
          '<div class="card" id="contactSection"><h2>📞 '+esc(T[L].contact)+'</h2><p style="margin:0">'+esc(cc.name||"TASVIA Academy")+'</p>'+
          (cc.address?'<p class="sub">'+esc(cc.address)+'</p>':"")+
          (phone?'<div class="acts"><a class="btn gold" href="tel:'+esc(phone)+'">📞 '+esc(T[L].call)+'</a><a class="btn" target="_blank" rel="noopener" href="https://wa.me/91'+esc(phone.replace(/^91/,""))+'">💬 '+esc(T[L].wa)+'</a></div>':"")+
          '</div>';
        document.getElementById("main").innerHTML=safeHtml;
        try{loadDailyGK()}catch(_){}
        try{loadCurrentAffairs().then(()=>{const el=document.getElementById("currentAffairsCard");if(el)el.innerHTML=buildCurrentAffairsCard()}).catch(()=>{})}catch(_){}
        try{const dueRows=fees.filter(f=>f&&f.dueDate&&today()>=String(f.dueDate)&&Math.max(0,Number(f.fee||0)-Number(f.paid||0))>0);const dueAmt=dueRows.reduce((n,f)=>n+Math.max(0,Number(f.fee||0)-Number(f.paid||0)),0);if(dueAmt>0&&typeof showFeeDuePopup==="function")showFeeDuePopup(dueAmt)}catch(_){};
      }catch(fallbackErr){
        console.error("TASVIA Parent Portal safe dashboard error:",fallbackErr);

      }
    }

      try{

    }).catch(()=>{});
    loadDailyGK();
    try{

    return true;
  }

  let loaded=false;
  async function fetchJSON(url,ms){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),ms);
    try{
      const r=await fetch(url,{cache:"no-store",signal:controller.signal,mode:"cors",credentials:"omit"});
      if(r.status===404)return null;
      if(!r.ok)throw new Error("HTTP "+r.status);
      return await r.json();
    }finally{clearTimeout(timer)}
  }
  async function loadREST(){
    const firestoreUrl="https://firestore.googleapis.com/v1/projects/tasvia-academy/databases/(default)/documents/parentView/"+encodeURIComponent(code);
    try{
      const d=await fetchJSON(firestoreUrl,4500);
      if(d){
        const o={};Object.entries(d.fields||{}).forEach(([k,v])=>o[k]=fv(v));return o;
      }
      return null;
    }catch(e){
      console.warn("Direct Firestore REST unavailable; trying Vercel parent proxy:",e);
    }
    try{
      const api=await fetchJSON("https://tasvia-app-two.vercel.app/api/parent?code="+encodeURIComponent(code),4500);
      if(api && api.fields){
        const o={};Object.entries(api.fields).forEach(([k,v])=>o[k]=fv(v));return o;
      }
      return null;
    }catch(e){
      console.warn("Vercel parent proxy unavailable:",e);
      throw e;
    }
  }
  function finish(data){
    if(loaded)return;
    try{
      if(!data){loaded=true;const m=document.getElementById("studentLoginMsg");if(m)m.textContent="Student ID not found. Please check the ID or ask TASVIA staff to sync the parent portal.";showWelcome({keepInput:true,keepMessage:true});return}
      if(applyData(data)){
        loaded=true;
        window.tasviaWelcomeEntered=true;
        closeWelcome();
      }
    }catch(err){
      console.error("TASVIA Parent Portal render error:",err);
      loaded=true;
      msg("TASVIA Parent Portal opened, but the student data could not be displayed. Please tap Try again.",true);
    }
  }
  // Never leave a valid login stuck on "Checking Student ID".
  // REST gets a short timeout; Firebase fallback gets its own timeout too.
  const startupTimeout=setTimeout(()=>{
    if(!loaded){
      const m=document.getElementById("studentLoginMsg");
      if(m)m.textContent="Taking too long to connect. Please tap Login again.";
      showWelcome({keepInput:true,keepMessage:true});
    }
  },10000);
  loadREST().then(data=>{
    clearTimeout(startupTimeout);
    if(!data){
      if(!loaded){
        const m=document.getElementById("studentLoginMsg");
        if(m)m.textContent="Student ID not found. Please check the ID or ask TASVIA staff to sync the parent portal.";
        showWelcome({keepInput:true,keepMessage:true});
      }
      return;
    }
    finish(data);
    try{
      if(window.firebase&&window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey){
        if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
        const ref=firebase.firestore().doc("parentView/"+code);
        loadHomeworkCompletions().catch(()=>{});
        ref.onSnapshot(d=>{if(d.exists)applyData(d.data())},()=>{});
      }
    }catch(e){console.warn("TASVIA live sync unavailable:",e)}
  }).catch(e=>{
    console.error("TASVIA Parent Portal REST startup:",e);
    try{
      if(window.firebase&&window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey){
        if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
        const ref=firebase.firestore().doc("parentView/"+code);
        loadHomeworkCompletions().catch(()=>{});
        let done=false;
        const timer=setTimeout(()=>{
          if(done||loaded)return;
          done=true;
          const m=document.getElementById("studentLoginMsg");
          if(m)m.textContent="Could not connect to TASVIA. Please check your internet connection and tap Login again.";
          showWelcome({keepInput:true,keepMessage:true});
        },5000);
        ref.get().then(snap=>{
          if(done||loaded)return;
          done=true; clearTimeout(timer);
          finish(snap.exists?snap.data():null);
        }).catch(()=>{
          if(done||loaded)return;
          done=true; clearTimeout(timer);
          const m=document.getElementById("studentLoginMsg");
          if(m)m.textContent="Could not connect to TASVIA. Please check your internet connection and tap Login again.";
          showWelcome({keepInput:true,keepMessage:true});
        });
      }else{
        clearTimeout(startupTimeout);
        msg(T[L].offline,true);
      }
    }catch(err){
      clearTimeout(startupTimeout);
      console.error("TASVIA Parent Portal SDK fallback:",err);
      msg(T[L].offline,true);
    }
  });
}
