name: Daily GK Update

on:
  schedule:
    # Run shortly after midnight IST, with a retry 30 minutes later.
    # GitHub Actions cron is in UTC: 18:35 UTC = 00:05 IST; 19:05 UTC = 00:35 IST.
    - cron: "35 18 * * *"
    - cron: "5 19 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_daily_gk.py"
      - "gk-question-bank.json"
      - "static-gk-extra.json"
      - ".github/workflows/daily-gk.yml"

permissions:
  contents: write

jobs:
  update-gk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate daily GK
        run: python3 scripts/update_daily_gk.py

      - name: Validate today's five unique questions
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          ist = timezone(timedelta(hours=5, minutes=30))
          expected_date = datetime.now(ist).strftime("%Y-%m-%d")
          daily = json.loads(Path("daily-gk.json").read_text(encoding="utf-8"))
          date = daily.get("date")
          if date != expected_date:
              raise SystemExit(f"Stale GK date: expected {expected_date}, found {date!r}")

          questions = daily.get("questions", [])
          if len(questions) != 5:
              raise SystemExit(f"Expected 5 questions, found {len(questions)}")
          ids = [item.get("id") for item in questions]
          if any(not qid for qid in ids) or len(set(ids)) != 5:
              raise SystemExit("Today's GK set has missing or duplicate question IDs.")

          bank = json.loads(Path("gk-question-bank.json").read_text(encoding="utf-8")).get("questions", [])
          extra_path = Path("static-gk-extra.json")
          if extra_path.exists():
              bank.extend(json.loads(extra_path.read_text(encoding="utf-8")).get("questions", []))
          bank_by_id = {item.get("id"): item for item in bank if item.get("id")}
          custom = {
              "static-sports-olympics": ["Every two years", "Every three years", "Every five years"],
              "static-sports-chess": ["32", "48", "100"],
              "otq-brain-teasers-2310": ["1", "2", "3"],
          }
          def norm(value):
              return " ".join(str(value or "").casefold().split())

          used_ids = set()
          for old_archive in Path("daily-gk-history").glob("*.json"):
              if old_archive.name == f"{date}.json":
                  continue
              try:
                  old_data = json.loads(old_archive.read_text(encoding="utf-8"))
                  used_ids.update(q.get("id") for q in old_data.get("questions", []) if q.get("id"))
              except (OSError, json.JSONDecodeError):
                  raise SystemExit(f"Could not validate historical archive {old_archive}")

          seen_questions = set()
          for number, item in enumerate(questions, start=1):
              question = " ".join(str(item.get("q", "")).casefold().split())
              if not question or question in seen_questions:
                  raise SystemExit(f"Question {number} is blank or duplicates another question.")
              seen_questions.add(question)

              options = item.get("options")
              if not isinstance(options, list) or len(options) != 4:
                  raise SystemExit(f"Question {number} must have exactly four A-D options.")
              normalized = [" ".join(str(value).casefold().split()) for value in options]
              if any(not value for value in normalized) or len(set(normalized)) != 4:
                  raise SystemExit(f"Question {number} has blank or duplicate options.")
              answer = norm(item.get("a", ""))
              if answer not in set(normalized):
                  raise SystemExit(f"Question {number} does not include its correct answer among the options.")
              if item.get("id") in used_ids:
                  raise SystemExit(f"Question {number} repeats a question ID from an older archive.")
              source = bank_by_id.get(item.get("id"))
              if not source or norm(source.get("q")) != norm(item.get("q")) or norm(source.get("a")) != answer:
                  raise SystemExit(f"Question {number} does not match the curated question bank.")
              source_options = source.get("options")
              if isinstance(source_options, list) and len(source_options) == 4:
                  expected = {norm(value) for value in source_options}
                  if len(expected) != 4 or answer not in expected:
                      expected = set()
              else:
                  distractors = custom.get(item.get("id"), [])
                  expected = {norm(source.get("a"))} | {norm(value) for value in distractors}
              if len(expected) != 4 or set(normalized) != expected:
                  raise SystemExit(f"Question {number} uses options that are not curated for this exact question.")

          archive = Path("daily-gk-history") / f"{date}.json"
          if not archive.exists():
              raise SystemExit(f"Missing GK archive for {date}")
          archived = json.loads(archive.read_text(encoding="utf-8"))
          if archived != daily:
              raise SystemExit("Today's GK file and its history archive do not match.")
          print(f"Validated fresh GK for {date}: 5 unique questions, four distinct options each, and matching archive.")
          PY

      - name: Commit changes
        run: |
          git config user.name "TASVIA GK Bot"
          git config user.email "actions@github.com"
          git add gk-question-bank.json daily-gk.json daily-gk-history/
          if git diff --cached --quiet; then
            echo "No GK changes to commit."
          else
            git commit -m "chore: daily non-repeating GK update"
            git pull --rebase origin main
            git push
          fi
