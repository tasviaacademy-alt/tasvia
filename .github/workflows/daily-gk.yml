name: Daily GK Update

on:
  schedule:
    # Run every day at 05:50 and 08:50 India Standard Time.
    - cron: "20 0 * * *"
    - cron: "20 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_daily_gk.py"
      - ".github/workflows/daily-gk.yml"

permissions:
  contents: write

jobs:
  update-gk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate daily GK
        run: python3 scripts/update_daily_gk.py

      - name: Validate today's five unique questions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          daily = json.loads(Path("daily-gk.json").read_text(encoding="utf-8"))
          questions = daily.get("questions", [])
          if len(questions) != 5:
              raise SystemExit(f"Expected 5 questions, found {len(questions)}")
          ids = [item.get("id") for item in questions]
          if any(not qid for qid in ids) or len(set(ids)) != 5:
              raise SystemExit("Today's GK set has missing or duplicate question IDs.")

          date = daily.get("date")
          archive = Path("daily-gk-history") / f"{date}.json"
          if not archive.exists():
              raise SystemExit(f"Missing GK archive for {date}")
          print(f"Validated 5 unique GK questions for {date}.")
          PY

      - name: Commit changes
        run: |
          git config user.name "TASVIA GK Bot"
          git config user.email "actions@github.com"
          git add gk-question-bank.json daily-gk.json daily-gk-history/
          if git diff --cached --quiet; then
            echo "No GK changes to commit."
          else
            git commit -m "chore: daily non-repeating GK update"
            git push
          fi
