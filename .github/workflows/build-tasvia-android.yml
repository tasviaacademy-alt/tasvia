name: Build TASVIA Android App Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli @bubblewrap/core

      - name: Generate Android project
        run: |
          NODE_PATH="$(npm root -g)" node <<'NODE'
          const {TwaGenerator, TwaManifest, ConsoleLog} = require('@bubblewrap/core');
          (async () => {
            const manifest = await TwaManifest.fromFile('twa-manifest.json');
            manifest.generatorApp = 'bubblewrap-cli';
            const generator = new TwaGenerator();
            await generator.removeTwaProject('android-twa');
            await generator.createTwaProject('android-twa', manifest, new ConsoleLog('TASVIA'));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

           - name: Create Bubblewrap manifest checksum
        run: |
          sha1sum twa-manifest.json | awk '{printf "%s",$1}' > android-twa/manifest-checksum.txt - name: Decode upload keystore
        env:
          TASVIA_KEYSTORE_BASE64: ${{ secrets.TASVIA_KEYSTORE_BASE64 }}
        run: |
          test -n "$TASVIA_KEYSTORE_BASE64"
          printf '%s' "$TASVIA_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode --ignore-garbage > android.keystore
          test -s android.keystore

      - name: Configure Bubblewrap toolchain
        run: |
          test -n "$JAVA_HOME"
          test -n "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/bin"
          if [ ! -e "$ANDROID_HOME/bin/sdkmanager" ]; then
            ln -s "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/bin/sdkmanager"
          fi
          mkdir -p "$HOME/.bubblewrap"
          printf '%s\n' "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"
          test -x "$ANDROID_HOME/bin/sdkmanager"
          bubblewrap doctor

      - name: Build signed APK and AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.TASVIA_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.TASVIA_KEY_PASSWORD }}
        run: |
          test -n "$BUBBLEWRAP_KEYSTORE_PASSWORD"
          test -n "$BUBBLEWRAP_KEY_PASSWORD"
          cd android-twa && bubblewrap build --manifest=../twa-manifest.json --signingKeyPath=../android.keystore --signingKeyAlias=tasvia --skipPwaValidation

      - name: Upload Play Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tasvia-playstore-build
          path: |
            android-twa/app-release-bundle.aab
            android-twa/app-release-signed.apk
            android-twa/assetlinks.json
