name: Update Nizamabad Local News

on:
  schedule:
    # Daily at 05:00 IST (23:30 UTC on the previous day)
    - cron: "30 23 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_local_news.py"
      - ".github/workflows/update-nizamabad-news.yml"

permissions:
  contents: write

concurrency:
  group: update-nizamabad-local-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate updater and existing news data
        run: |
          python -m py_compile scripts/update_local_news.py
          python -m json.tool local-news.json > /dev/null
      - name: Fetch and prepare latest headlines
        run: python scripts/update_local_news.py
      - name: Commit updated headlines
        run: |
          if git diff --quiet -- local-news.json; then
            echo "No news changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-news.json
          git commit -m "chore: refresh Nizamabad local news"
          git push
