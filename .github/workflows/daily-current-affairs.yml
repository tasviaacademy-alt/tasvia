name: Daily Current Affairs Update

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-current-affairs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update current affairs
        run: python3 scripts/update_current_affairs.py

      - name: Commit changes
        run: |
          git config user.name "TASVIA Current Affairs Bot"
          git config user.email "actions@github.com"
          git add current-affairs.json current-affairs-history/
          if git diff --cached --quiet; then
            echo "No current-affairs changes to commit."
          else
            git commit -m "chore: daily current affairs update"
            git push
          fi
