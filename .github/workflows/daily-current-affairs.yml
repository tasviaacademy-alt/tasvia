name: Daily Current Affairs Update

on:
  schedule:
    # GitHub Actions cron is UTC: 18:45 UTC = 00:15 IST; 19:15 UTC = 00:45 IST.
    # The second run is a retry in case the first update fails or feeds are late.
    - cron: "45 18 * * *"
    - cron: "15 19 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_current_affairs.py"
      - "current-affairs.json"
      - ".github/workflows/daily-current-affairs.yml"

permissions:
  contents: write

jobs:
  update-current-affairs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update current affairs
        run: python3 scripts/update_current_affairs.py

      - name: Validate archive uniqueness
        run: |
          python3 - <<'PY'
          import json, re
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          def norm(s): return re.sub(r"[^a-z0-9]+", " ", (s or "").lower()).strip()
          ist = timezone(timedelta(hours=5, minutes=30))
          today = datetime.now(ist).strftime("%Y-%m-%d")
          daily = json.loads(Path("current-affairs.json").read_text(encoding="utf-8"))
          if daily.get("date") != today:
              raise SystemExit(f"Stale Current Affairs date: expected {today}, found {daily.get('date')!r}")
          if len(daily.get("items", [])) < 5 or len(daily.get("quiz", [])) != len(daily.get("items", [])):
              raise SystemExit("Current Affairs needs at least five quality stories and five factual quiz questions.")
          for number, item in enumerate(daily["items"], 1):
              title = str(item.get("title", "")).strip()
              summary = str(item.get("text", "")).strip()
              title_norm, summary_norm = norm(title), norm(summary)
              if len(title) < 20 or len(summary) < 90:
                  raise SystemExit(f"Story {number} has a generic title or an insufficient summary.")
              if not str(item.get("url", "")).startswith("https://") or not str(item.get("source", "")).strip():
                  raise SystemExit(f"Story {number} is missing a valid HTTPS source link or publisher.")
              if re.search(r"\b(account subscription benefits|premium stories|unlock these with subscription|subscribe to read|subscription required|log in to continue|register to continue)\b", summary.lower()):
                  raise SystemExit(f"Story {number} contains paywall or subscription boilerplate.")
              if re.search(r"\b(home|current affairs|latest news|live updates|live blog|live stream|fixtures|betting|odds|predictions?|opinion|news feed|watch live)\b", title.lower()):
                  raise SystemExit(f"Story {number} uses a generic or unsuitable headline: {title}")
              if summary_norm == title_norm or (summary_norm.startswith(title_norm) and len(summary_norm) - len(title_norm) < 45):
                  raise SystemExit(f"Story {number} summary merely repeats its headline.")
          for number, (item, question) in enumerate(zip(daily["items"], daily["quiz"]), 1):
              q = str(question.get("q", "")).strip()
              a = str(question.get("a", "")).strip()
              if not q or not a or q.casefold().startswith("which topic is covered"):
                  raise SystemExit(f"Quiz question {number} is empty or only asks students to identify a headline.")
              if re.search(r"^how many .+ were mentioned in the report[?.!]*$", q, re.I):
                  raise SystemExit(f"Quiz question {number} is too vague to test a specific fact.")
              if re.search(r"what amount or figure did the report state|what figure did the report give for the latest measured result", q, re.I):
                  raise SystemExit(f"Quiz question {number} uses a generic numeric prompt.")
              if re.fullmatch(r"(?:19|20)\d{2}\s+youth", a, re.I):
                  raise SystemExit(f"Quiz question {number} mistakes an event year for a quantity.")
              evidence = " ".join(str(item.get(key, "")) for key in ("title", "text"))
              answer_numbers = [value.replace(",", "") for value in re.findall(r"\d[\d,]*(?:\.\d+)?", a)]
              evidence_numbers = {value.replace(",", "") for value in re.findall(r"\d[\d,]*(?:\.\d+)?", evidence)}
              if any(value not in evidence_numbers for value in answer_numbers):
                  raise SystemExit(f"Quiz answer {number} contains a number not present in its source story.")
              currency_pattern = (
                  r"(?:₹|Rs\.?\s*|US\$|USD\s*|\$|€|£)\s*\d[\d,]*(?:\.\d+)?"
                  r"(?:\s*(?:lakh crore|crore|lakh|billion|million|trillion|thousand))?"
              )
              answer_money = re.search(currency_pattern, a, re.I)
              summary = str(item.get("text", ""))
              title = str(item.get("title", ""))
              evidence_money = re.search(currency_pattern, summary, re.I) or re.search(currency_pattern, title, re.I)
              if answer_money and evidence_money:
                  unit_pattern = r"\b(lakh crore|crore|lakh|billion|million|trillion|thousand)\b"
                  answer_unit = re.search(unit_pattern, answer_money.group(0), re.I)
                  evidence_unit = re.search(unit_pattern, evidence_money.group(0), re.I)
                  if evidence_unit and (not answer_unit or answer_unit.group(0).casefold() != evidence_unit.group(0).casefold()):
                      raise SystemExit(f"Quiz answer {number} omits or changes the monetary unit in its source story.")
          today_archive = Path("current-affairs-history") / f"{today}.json"
          if not today_archive.exists() or json.loads(today_archive.read_text(encoding="utf-8")) != daily:
              raise SystemExit("Today's Current Affairs file and dated archive do not match.")

          # Match the generator's rolling 3-day duplicate window. Older stories may
          # legitimately recur when there is a genuinely new development.
          seen = {}
          today_date = datetime.strptime(today, "%Y-%m-%d").date()
          checked_archives = 0
          for path in sorted(Path("current-affairs-history").glob("*.json")):
              archive_date = datetime.strptime(path.stem, "%Y-%m-%d").date()
              if (today_date - archive_date).days > 3:
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("date") != path.stem or not data.get("items"):
                  raise SystemExit(f"{path}: invalid/empty archive")
              for item in data["items"]:
                  key = norm(item.get("title"))
                  if key in seen and seen[key] != path.stem:
                      raise SystemExit(f"Repeated current-affairs story in recent archives: {item.get('title')}")
                  seen[key] = path.stem
              checked_archives += 1
          print(f"Validated today's content and {len(seen)} unique stories across {checked_archives} recent archives.")
          PY

      - name: Commit changes
        run: |
          git config user.name "TASVIA Current Affairs Bot"
          git config user.email "actions@github.com"
          git add current-affairs.json current-affairs-history/
          if git diff --cached --quiet; then
            echo "No current-affairs changes to commit."
          else
            git commit -m "chore: daily non-repeating current affairs update"
            git pull --rebase origin main
            git push
          fi
