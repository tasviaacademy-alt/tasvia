name: Refresh Daily GK (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-gk-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate GK using the validated primary script
        run: python3 scripts/update_daily_gk.py

      - name: Validate current edition and archive
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          today = datetime.now(timezone(timedelta(hours=5, minutes=30))).strftime("%Y-%m-%d")
          daily = json.loads(Path("daily-gk.json").read_text(encoding="utf-8"))
          if daily.get("date") != today or len(daily.get("questions", [])) != 5:
              raise SystemExit("GK output is stale or does not contain exactly five questions.")
          archive = Path("daily-gk-history") / f"{today}.json"
          if not archive.exists() or json.loads(archive.read_text(encoding="utf-8")) != daily:
              raise SystemExit("GK history archive does not match today's output.")
          for number, q in enumerate(daily["questions"], 1):
              options = q.get("options", [])
              norm = lambda value: " ".join(str(value or "").casefold().split())
              normalized = [norm(value) for value in options]
              if len(normalized) != 4 or len(set(normalized)) != 4 or norm(q.get("a")) not in set(normalized):
                  raise SystemExit(f"Question {number} has invalid multiple-choice options.")
          print(f"Validated curated GK edition and archive for {today}.")
          PY

      - name: Commit daily GK and archive if changed
        run: |
          git config user.name "TASVIA GK Bot"
          git config user.email "actions@github.com"
          git add daily-gk.json daily-gk-history/
          if git diff --cached --quiet; then
            echo "No GK changes to commit."
          else
            git commit -m "chore: refresh validated daily GK"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
