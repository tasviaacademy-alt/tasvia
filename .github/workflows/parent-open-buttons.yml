name: Parent Portal Open-Section Fix
on:
  workflow_dispatch:
  push:
    paths:
      - "parent/index.html"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change quick actions from jump links to open views
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("parent/index.html")
          s=p.read_text()
          old='''  <a class="parent-action" href="#homeworkSection"><span class="parent-action-icon">📚</span><span>Homework</span></a>
  <a class="parent-action" href="#bodmasSection"><span class="parent-action-icon">🧮</span><span>BODMAS Practice</span></a>
  <a class="parent-action" href="#gkSection"><span class="parent-action-icon">🧠</span><span>General Knowledge</span></a>
  <a class="parent-action" href="#currentAffairsCard"><span class="parent-action-icon">📰</span><span>Current Affairs</span></a>'''
          new='''  <button type="button" class="parent-action" onclick="openParentSection('homeworkSection')"><span class="parent-action-icon">📚</span><span>Homework</span></button>
  <button type="button" class="parent-action" onclick="openParentSection('bodmasSection')"><span class="parent-action-icon">🧮</span><span>BODMAS Practice</span></button>
  <button type="button" class="parent-action" onclick="openParentSection('gkSection')"><span class="parent-action-icon">🧠</span><span>General Knowledge</span></button>
  <button type="button" class="parent-action" onclick="openParentSection('currentAffairsCard')"><span class="parent-action-icon">📰</span><span>Current Affairs</span></button>'''
          if old not in s:
              raise SystemExit("quick-action block not found")
          s=s.replace(old,new,1)
          marker='''function render(){'''
          insert='''function openParentSection(id){
  const source=document.getElementById(id);
  if(!source)return;
  let layer=document.getElementById("parentSectionViewer");
  if(!layer){
    layer=document.createElement("div");
    layer.id="parentSectionViewer";
    layer.className="parent-section-viewer";
    layer.innerHTML='<div class="parent-section-top"><button type="button" class="parent-section-close" aria-label="Close">✕</button><div class="parent-section-title">TASVIA Academy</div></div><div class="parent-section-body" id="parentSectionBody"></div>';
    document.body.appendChild(layer);
    layer.querySelector(".parent-section-close").onclick=closeParentSection;
  }
  document.getElementById("parentSectionBody").innerHTML=source.outerHTML;
  layer.classList.add("show");
  document.body.classList.add("parent-view-open");
  layer.scrollTop=0;
}
function closeParentSection(){
  const layer=document.getElementById("parentSectionViewer");
  if(layer)layer.classList.remove("show");
  document.body.classList.remove("parent-view-open");
}
'''
          if marker not in s:
              raise SystemExit("render marker not found")
          s=s.replace(marker,insert+marker,1)
          css_marker='''#homeworkSection,#bodmasSection,#gkSection,#currentAffairsCard{scroll-margin-top:14px}'''
          css_add='''#homeworkSection,#bodmasSection,#gkSection,#currentAffairsCard{scroll-margin-top:14px}
.parent-action{border:1px solid var(--line);font:inherit;cursor:pointer}
.parent-section-viewer{position:fixed;inset:0;z-index:2000;background:var(--bg);overflow-y:auto;display:none}
.parent-section-viewer.show{display:block}
.parent-view-open{overflow:hidden}
.parent-section-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--board);color:var(--chalk);box-shadow:0 2px 12px rgba(0,0,0,.18)}
.parent-section-close{width:42px;height:42px;border:0;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-size:22px;cursor:pointer}
.parent-section-title{font-weight:700;font-size:1.05rem}
.parent-section-body{max-width:640px;margin:0 auto;padding:0 14px 40px}
.parent-section-body > .card{margin-top:14px}
.parent-section-body .parent-section-viewer{position:static;display:block}
'''
          if css_marker not in s:
              raise SystemExit("css marker not found")
          s=s.replace(css_marker,css_add,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parent/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Open parent portal quick actions as separate views"
          git push
