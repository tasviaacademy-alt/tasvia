name: Deploy TASVIA Staff App to GitHub Pages
# Deployment validation fixed
# Force deployment on every main push
# Parent portal redirect deployed to stable host
# Force cache-clear build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate application files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html parent.html parent/index.html firebase-config.js sw.js manifest.json vercel.json CNAME; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
            echo "Found: $file"
          done
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json OK')"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json OK')"
          grep -q 'tasvia-academy' firebase-config.js
          grep -q 'TASVIA Academy' index.html
          grep -q 'TASVIA Academy' parent/index.html
          echo "TASVIA application file validation passed."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
