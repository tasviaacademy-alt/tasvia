name: Validate TASVIA Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate application files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html staff-login.html parent.html parent/index.html firebase-config.js sw.js manifest.json CNAME; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
            echo "Found: $file"
          done
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json OK')"
          grep -q 'tasvia-academy' firebase-config.js
          grep -q 'TASVIA Academy' index.html
          grep -q 'TASVIA Academy' parent/index.html
          grep -q 'staff-login' index.html
          echo "TASVIA validation passed. GitHub Pages deployment is handled by the repository's single Pages deployment workflow."
