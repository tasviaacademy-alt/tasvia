<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>TASVIA Academy – Parent Portal</title>
<script>
(function(){
  "use strict";
  // Route legacy parent links to the canonical live portal and preserve the student code.
  var q=new URLSearchParams(location.search||"");
  var code=q.get("code")||q.get("pcode")||q.get("parentCode")||q.get("student")||q.get("studentCode")||q.get("studentId")||q.get("id")||"";
  if(!code && location.hash) code=String(location.hash).replace(/^#/,"");
  var target="https://apk.tasviaacademy.com/parent.html";
  if(code) target+="?code="+encodeURIComponent(code);
  location.replace(target);
})();
</script>
</head>
<body><p>Opening TASVIA Parent Portal…</p><noscript>Please enable JavaScript to open the parent portal.</noscript></body>
</html>
